<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; flex-direction: column; height: 100vh; background: #07070d; font-family: 'Inter', sans-serif; }
        .map-header { background: rgba(7,7,13,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0.7rem 1.2rem; display: flex; align-items: center; justify-content: space-between; z-index: 1000; }
        .map-header .left { display: flex; align-items: center; gap: 0.8rem; }
        .map-header .left .back-btn { color: rgba(255,255,255,0.3); text-decoration: none; font-size: 1.1rem; }
        .map-header .left .back-btn:hover { color: #4facfe; }
        .map-header .left .info h4 { font-weight: 600; font-size: 0.85rem; color: rgba(255,255,255,0.5); }
        .map-header .left .info h4 span { color: #4facfe; font-weight: 700; }
        .map-header .left .info .meta { font-size: 0.65rem; color: rgba(255,255,255,0.2); margin-top: 0.15rem; }
        .map-header .credit { font-size: 0.7rem; color: rgba(255,255,255,0.15); }
        .map-header .credit a { color: rgba(79,172,254,0.4); text-decoration: none; }
        .map-header .credit a:hover { color: #4facfe; }
        #map { flex: 1; width: 100%; }
    </style>
</head>
<body>
    <div class="map-header">
        <div class="left">
            <a href="/" class="back-btn">←</a>
            <div class="info">
                <h4>ID: <span id="display-id">{{ id }}</span></h4>
                <div class="meta">Live tracking</div>
            </div>
        </div>
        <div class="credit">Developed by <a href="https://github.com/JitendraNishad91">JitendraNishad91</a></div>
    </div>
    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const id = new URLSearchParams(location.search).get("id")
        let latLng

        try {
            latLng = JSON.parse(`{{ data }}`)
        } catch (e) {
            latLng = [20.5937, 78.9629]
        }

        const map = L.map('map').setView(latLng, 12)
        const marker = L.marker(latLng).addTo(map)

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map)

        document.getElementById("display-id").innerHTML = id

        const socket = io("", { secure: true, path: "/socket.io", transports: ['websocket'] })
        socket.on("map-data", data => {
            if (data.id == id) {
                marker.setLatLng([data.lat, data.lng])
                map.setView([data.lat, data.lng])
            }
        })
    </script>
</body>
</html>
